<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محاسبه شاخص توده بدنی (BMI)</title>

<style>
body {
    font-family: Tahoma;
    background: #f4fefe;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.card {
    background: #ffffff;
    padding: 25px;
    width: 340px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #009688;
    margin-bottom: 20px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    background: #009688;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #00796b;
}

.result {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.normal { background: #e8f5e9; color: #2e7d32; }
.under { background: #e3f2fd; color: #1565c0; }
.over  { background: #fff3e0; color: #ef6c00; }
.obese { background: #ffebee; color: #c62828; }

.note {
    font-weight: normal;
    font-size: 13px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="card">
    <h2>محاسبه BMI</h2>

    <input type="number" id="weight" placeholder="وزن (کیلوگرم)">
    <input type="number" id="height" placeholder="قد (سانتی‌متر)">

    <button onclick="calculateBMI()">محاسبه</button>

    <div id="result" class="result"></div>
</div>

<script>
function calculateBMI() {
    let weight = document.getElementById("weight").value;
    let heightCm = document.getElementById("height").value;

    if (!weight || !heightCm) {
        alert("لطفاً قد و وزن را وارد کنید");
        return;
    }

    let heightM = heightCm / 100;
    let bmi = weight / (heightM * heightM);
    bmi = bmi.toFixed(1);

    let status = "";
    let note = "";
    let cssClass = "";

    if (bmi < 18.5) {
        status = "کم‌وزن";
        cssClass = "under";
        note = "پیشنهاد می‌شود بررسی تغذیه‌ای و ارزیابی بالینی انجام شود.";
    } 
    else if (bmi < 25) {
        status = "نرمال";
        cssClass = "normal";
        note = "وضعیت مطلوب است؛ حفظ سبک زندگی سالم توصیه می‌شود.";
    } 
    else if (bmi < 30) {
        status = "اضافه وزن";
        cssClass = "over";
        note = "اصلاح رژیم غذایی و افزایش فعالیت بدنی توصیه می‌شود.";
    } 
    else {
        status = "چاقی";
        cssClass = "obese";
        note = "نیاز به مداخله پزشکی و پایش منظم وجود دارد.";
    }

    document.getElementById("result").className = "result " + cssClass;
    document.getElementById("result").innerHTML =
        `BMI شما: ${bmi}<br>
        وضعیت: ${status}
        <div class="note">${note}</div>`;
}
</script>

</body>
</html>
